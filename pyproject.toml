[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-harness"
version = "0.1.0"
description = "Harness do Desafio Lumi Agêntico: baseline, avaliação e análise de erros do Lumi 4B no benchmark VAKRA"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lumi-harness = "harness.__main__:main"

[tool.setuptools]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: precisa de acesso à internet (desligado por padrão)"]
addopts = "-m 'not network'"
